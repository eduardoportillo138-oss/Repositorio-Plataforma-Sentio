# Infraestructura local de desarrollo.
# Uso (PowerShell, desde la raíz):  pnpm infra:up   |   pnpm infra:down
name: sentio

services:
  mongo:
    image: mongo:7
    container_name: sentio-mongo
    # Replica set de un nodo: habilita transacciones y change streams.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      # Solo expuesto en la máquina local.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicializa el replica set la primera vez y luego solo verifica su estado.
      # El miembro se anuncia como localhost:27017 para que la API (que corre en el host) lo resuelva.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentio-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Almacenamiento de objetos compatible con S3 (fotos de perfil y medios).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sentio-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sentio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sentio-dev-secret}
    ports:
      - '127.0.0.1:9000:9000' # API S3
      - '127.0.0.1:9001:9001' # Consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Crea el bucket y deja público (solo lectura) el prefijo de variantes procesadas.
  # Los originales (uploads/) siguen privados.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: sentio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sentio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sentio-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-sentio-media}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set download "local/$${S3_BUCKET}/avatars"
    restart: 'no'

volumes:
  mongo-data:
  redis-data:
  minio-data:
