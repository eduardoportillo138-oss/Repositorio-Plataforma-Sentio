# Búsqueda. Solo datos públicos (PublicUser no tiene campos privados).

fragment UserSearchFields on PublicUser {
  id
  handle
  displayName
  tags
  avatar {
    ...AvatarFields
  }
}

query SearchUsers($query: String!, $first: Int = 20, $after: String) {
  searchUsers(query: $query, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...UserSearchFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query SearchPosts($query: String!, $first: Int = 20, $after: String) {
  searchPosts(query: $query, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...PostFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query RecentSearches {
  recentSearches {
    id
    query
    searchedAt
  }
}

mutation ClearSearchHistory {
  clearSearchHistory
}
